spring.application.name=feedback-management

# MongoDB. Set MONGODB_URI to the Atlas connection string when deploying;
# the default keeps a local mongod working with no configuration.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/feedback_db}

# JWT. JWT_SECRET must be overridden in any real deployment — the default is public.
jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1mb3ItZmVlZGJhY2stbWFuYWdlbWVudC1zeXN0ZW0tMjAyNA==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Hosting platforms (Render, Railway, Heroku, Fly) inject the port to bind on.
server.port=${PORT:8080}

# Seeds the demo dataset, but only into a database with no users yet.
app.seed-demo-data=${SEED_DEMO_DATA:false}
