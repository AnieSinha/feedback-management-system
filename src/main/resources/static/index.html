<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback Management System</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Auth screen -->
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Feedback Management</h1>
          <p class="muted">Training programs, courses and analytics</p>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Authentication">
        <button role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true" class="tab active">Sign in</button>
        <button role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" class="tab">Create account</button>
      </div>

      <form id="panel-login" role="tabpanel" aria-labelledby="tab-login" class="auth-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required />
          <p class="field-error" data-error-for="login-email" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" name="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" data-toggle="login-password" aria-label="Show password"></button>
          </div>
          <p class="field-error" data-error-for="login-password" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <form id="panel-register" role="tabpanel" aria-labelledby="tab-register" class="auth-form" hidden novalidate>
        <div class="field">
          <label for="reg-username">Full name</label>
          <input type="text" id="reg-username" name="username" autocomplete="name" required />
          <p class="field-error" data-error-for="reg-username" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" required />
          <p class="field-error" data-error-for="reg-email" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="reg-password" name="password" autocomplete="new-password" required minlength="6" />
            <button type="button" class="password-toggle" data-toggle="reg-password" aria-label="Show password"></button>
          </div>
          <p class="helper">At least 6 characters.</p>
          <p class="field-error" data-error-for="reg-password" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="reg-role">Role</label>
          <select id="reg-role" name="role">
            <option value="PARTICIPANT">Participant</option>
            <option value="COORDINATOR">Coordinator</option>
            <option value="ADMIN">Admin</option>
          </select>
          <p class="helper">Demo build: the API accepts any role at registration.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-hint muted">
        Seeded dev logins: <code>admin@demo.com</code>, <code>coordinator@demo.com</code>,
        <code>alice@demo.com</code>, <code>dev@demo.com</code> — password <code>password123</code>
      </p>
    </div>
  </div>

  <!-- App shell -->
  <div id="app-shell" class="shell" hidden>
    <header class="topbar">
      <button id="nav-toggle" class="icon-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button>
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Feedback Management</span>
      </a>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Switch to dark theme"></button>
        <div class="user-chip">
          <span class="avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="user-meta">
            <span id="user-name" class="user-name"></span>
            <span id="user-role" class="badge badge-role"></span>
          </span>
        </div>
        <button id="logout-btn" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <div class="body">
      <nav id="sidebar" class="sidebar" aria-label="Main navigation">
        <ul id="nav-list" class="nav-list"></ul>
      </nav>
      <div id="scrim" class="scrim" hidden></div>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
