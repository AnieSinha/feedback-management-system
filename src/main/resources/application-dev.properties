# Dev profile: runs a real mongod in-process, no MongoDB install required.
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.data.mongodb.uri=mongodb://localhost:27019/feedback_dev
spring.data.mongodb.port=27019
de.flapdoodle.mongodb.embedded.version=7.0.14

# Seed demo users, courses, programs and feedback on startup (dev only).
app.seed-demo-data=true

logging.level.de.flapdoodle=WARN
logging.level.org.mongodb.driver=WARN
